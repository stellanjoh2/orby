<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#080808"/>
  <!-- Wireframe icosahedron-style facet with pulse band -->
  <polygon points="32,10 48,22 42,44 22,44 16,22" fill="none" stroke="#1a4a58" stroke-width="1.2"/>
  <polygon points="32,10 48,22 32,28" fill="none" stroke="#1a4a58" stroke-width="1.2"/>
  <polygon points="32,10 16,22 32,28" fill="none" stroke="#1a4a58" stroke-width="1.2"/>
  <polygon points="32,28 48,22 42,44" fill="none" stroke="#1a4a58" stroke-width="1.2"/>
  <polygon points="32,28 16,22 22,44" fill="none" stroke="#1a4a58" stroke-width="1.2"/>
  <polygon points="32,28 42,44 22,44" fill="none" stroke="#1a4a58" stroke-width="1.2"/>
  <!-- Emissive pulse traveling through edges -->
  <line x1="32" y1="10" x2="48" y2="22" stroke="#00ffd5" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="48" y1="22" x2="42" y2="44" stroke="#00ffd5" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="32" y1="28" x2="42" y2="44" stroke="#ff5ec8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="16" y1="22" x2="32" y2="28" stroke="#ff5ec8" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
  <!-- Subtle fresnel shell -->
  <polygon points="32,10 48,22 42,44 22,44 16,22" fill="url(#shell)" opacity="0.22"/>
  <defs>
    <radialGradient id="shell" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#00ffd5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00ffd5" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
</svg>
