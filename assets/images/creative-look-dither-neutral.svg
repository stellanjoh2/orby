    <rect x="23" y="26" width="3" height="3" fill="#a87810"/>
    <rect x="26" y="26" width="3" height="3" fill="#080808"/>
    <rect x="29" y="26" width="3" height="3" fill="#d4a020"/>
    <rect x="32" y="26" width="3" height="3" fill="#080808"/>
    <rect x="35" y="26" width="3" height="3" fill="#886008"/>
    <rect x="20" y="29" width="3" height="3" fill="#c89418"/>
    <rect x="23" y="29" width="3" height="3" fill="#080808"/>
    <rect x="26" y="29" width="3" height="3" fill="#f0c84a"/>
    <rect x="29" y="29" width="3" height="3" fill="#080808"/>
    <rect x="32" y="29" width="3" height="3" fill="#b88814"/>
    <rect x="35" y="29" width="3" height="3" fill="#080808"/>
    <!-- jaw / neck ramp -->
    <rect x="22" y="36" width="3" height="3" fill="#080808"/>
    <rect x="25" y="36" width="3" height="3" fill="#705008"/>
    <rect x="28" y="36" width="3" height="3" fill="#080808"/>
    <rect x="31" y="36" width="3" height="3" fill="#986810"/>
    <rect x="34" y="36" width="3" height="3" fill="#080808"/>
    <rect x="24" y="39" width="3" height="3" fill="#080808"/>
    <rect x="27" y="39" width="3" height="3" fill="#584004"/>
    <rect x="30" y="39" width="3" height="3" fill="#080808"/>
    <rect x="33" y="39" width="3" height="3" fill="#705008"/>
