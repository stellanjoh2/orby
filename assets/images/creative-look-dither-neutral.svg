<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#080808"/>
  <!-- placeholder portrait — warm gold Bayer blocks on orby-black -->
  <g opacity="0.95">
    <!-- highlight cheek / brow -->
    <rect x="18" y="14" width="3" height="3" fill="#f0c84a"/>
    <rect x="22" y="14" width="3" height="3" fill="#080808"/>
    <rect x="26" y="14" width="3" height="3" fill="#e8b830"/>
    <rect x="30" y="14" width="3" height="3" fill="#080808"/>
    <rect x="34" y="14" width="3" height="3" fill="#c89418"/>
    <rect x="38" y="14" width="3" height="3" fill="#080808"/>
    <!-- sunglasses band -->
    <rect x="16" y="20" width="3" height="3" fill="#080808"/>
    <rect x="19" y="20" width="3" height="3" fill="#080808"/>
    <rect x="22" y="20" width="3" height="3" fill="#080808"/>
    <rect x="25" y="20" width="3" height="3" fill="#080808"/>
    <rect x="28" y="20" width="3" height="3" fill="#080808"/>
    <rect x="31" y="20" width="3" height="3" fill="#080808"/>
    <rect x="34" y="20" width="3" height="3" fill="#080808"/>
    <rect x="37" y="20" width="3" height="3" fill="#080808"/>
    <rect x="40" y="20" width="3" height="3" fill="#080808"/>
