  <!-- corner Bayer swatch -->
  <rect x="8" y="48" width="2" height="2" fill="#f0c84a"/>
  <rect x="10" y="48" width="2" height="2" fill="#080808"/>
  <rect x="12" y="48" width="2" height="2" fill="#a87810"/>
  <rect x="14" y="48" width="2" height="2" fill="#080808"/>
  <rect x="8" y="50" width="2" height="2" fill="#080808"/>
  <rect x="10" y="50" width="2" height="2" fill="#705008"/>
  <rect x="12" y="50" width="2" height="2" fill="#080808"/>
  <rect x="14" y="50" width="2" height="2" fill="#d4a020"/>
