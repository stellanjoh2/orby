<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#000000"/>
  <!-- Vectrex-style wireframe ship + stars -->
  <polygon points="32,12 44,28 38,46 26,46 20,28" fill="none" stroke="#0a3a14" stroke-width="1.1"/>
  <polygon points="32,12 44,28 32,34" fill="none" stroke="#0a3a14" stroke-width="1.1"/>
  <polygon points="32,12 20,28 32,34" fill="none" stroke="#0a3a14" stroke-width="1.1"/>
  <polygon points="32,34 44,28 38,46" fill="none" stroke="#0a3a14" stroke-width="1.1"/>
  <polygon points="32,34 20,28 26,46" fill="none" stroke="#0a3a14" stroke-width="1.1"/>
  <polygon points="32,34 38,46 26,46" fill="none" stroke="#0a3a14" stroke-width="1.1"/>
  <!-- Hot phosphor edges -->
  <line x1="32" y1="12" x2="44" y2="28" stroke="#33ff55" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="44" y1="28" x2="38" y2="46" stroke="#33ff55" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="32" y1="34" x2="38" y2="46" stroke="#55ff77" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="20" y1="28" x2="32" y2="34" stroke="#55ff77" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <!-- Vector stars -->
  <circle cx="14" cy="18" r="1.6" fill="#33ff55" opacity="0.9"/>
  <circle cx="50" cy="14" r="1.2" fill="#33ff55" opacity="0.75"/>
  <circle cx="48" cy="38" r="1.4" fill="#55ff77" opacity="0.8"/>
  <circle cx="12" cy="42" r="1.0" fill="#33ff55" opacity="0.65"/>
  <!-- Phosphor glow halo -->
  <circle cx="14" cy="18" r="4" fill="url(#glow)" opacity="0.35"/>
  <circle cx="50" cy="14" r="3.5" fill="url(#glow)" opacity="0.28"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#33ff55" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#33ff55" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
