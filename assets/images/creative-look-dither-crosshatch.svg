<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#080808"/>
  <!-- 8-color crosshatch crush preview: sky / mid / field bands -->
  <g opacity="0.98">
    <!-- deep sky band -->
    <rect x="14" y="10" width="3" height="3" fill="#080808"/>
    <rect x="17" y="10" width="3" height="3" fill="#1a2848"/>
    <rect x="20" y="10" width="3" height="3" fill="#080808"/>
    <rect x="23" y="10" width="3" height="3" fill="#151028"/>
    <rect x="26" y="10" width="3" height="3" fill="#080808"/>
    <rect x="29" y="10" width="3" height="3" fill="#285868"/>
    <rect x="32" y="10" width="3" height="3" fill="#080808"/>
    <rect x="35" y="10" width="3" height="3" fill="#1a2848"/>
    <rect x="38" y="10" width="3" height="3" fill="#080808"/>
    <!-- lavender crosshatch mid -->
    <rect x="16" y="22" width="3" height="3" fill="#487888"/>
    <rect x="19" y="22" width="3" height="3" fill="#080808"/>
    <rect x="22" y="22" width="3" height="3" fill="#685888"/>
    <rect x="25" y="22" width="3" height="3" fill="#080808"/>
    <rect x="28" y="22" width="3" height="3" fill="#487888"/>
    <rect x="31" y="22" width="3" height="3" fill="#080808"/>
    <rect x="34" y="22" width="3" height="3" fill="#685888"/>
    <rect x="37" y="22" width="3" height="3" fill="#080808"/>
    <rect x="18" y="25" width="3" height="3" fill="#080808"/>
    <rect x="21" y="25" width="3" height="3" fill="#487888"/>
    <rect x="24" y="25" width="3" height="3" fill="#080808"/>
    <rect x="27" y="25" width="3" height="3" fill="#685888"/>
    <rect x="30" y="25" width="3" height="3" fill="#080808"/>
    <rect x="33" y="25" width="3" height="3" fill="#487888"/>
    <rect x="36" y="25" width="3" height="3" fill="#080808"/>
    <!-- warm highlight / gold field -->
    <rect x="20" y="36" width="3" height="3" fill="#080808"/>
    <rect x="23" y="36" width="3" height="3" fill="#c8b868"/>
    <rect x="26" y="36" width="3" height="3" fill="#080808"/>
    <rect x="29" y="36" width="3" height="3" fill="#ece8d8"/>
    <rect x="32" y="36" width="3" height="3" fill="#080808"/>
    <rect x="35" y="36" width="3" height="3" fill="#c8b868"/>
    <rect x="22" y="39" width="3" height="3" fill="#080808"/>
    <rect x="25" y="39" width="3" height="3" fill="#ece8d8"/>
    <rect x="28" y="39" width="3" height="3" fill="#080808"/>
    <rect x="31" y="39" width="3" height="3" fill="#c8b868"/>
    <rect x="34" y="39" width="3" height="3" fill="#080808"/>
    <rect x="37" y="39" width="3" height="3" fill="#ece8d8"/>
