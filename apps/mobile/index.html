<!DOCTYPE html>
<html lang="en" class="orby-mobile-app">
  <head>
    <meta charset="UTF-8" />
    <base href="/mobile/app/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#080808" />
    <meta name="orby-mobile-asset-base" content="/assets/" />
    <meta name="robots" content="noindex" />
    <title>Orby Mobile</title>
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles/mobile.css" />
    <style>
      html,
      body {
        background: #080808;
      }
      .orby-entry-gate {
        background: #080808;
      }
    </style>
    <script>
      window.__ORBY_ENTRY_GATE_ENABLED__ = true;
    </script>
    <script>
      (function () {
        if (typeof window !== 'undefined' && window.__ORBY_ENTRY_GATE_ENABLED__ === false) {
          document.documentElement.classList.add('orby-gate-unlocked');
          return;
        }
        try {
          var VERIFIED_KEY = 'orby_site_gate_verified';
          var VISIT_SEQ_KEY = 'orby_site_gate_visit_seq';
          var CHALLENGE_EVERY_N_VISITS = 5;
          var prev = parseInt(sessionStorage.getItem(VISIT_SEQ_KEY) || '0', 10);
          var visitSeq = (isNaN(prev) ? 0 : prev) + 1;
          sessionStorage.setItem(VISIT_SEQ_KEY, String(visitSeq));
          if (visitSeq % CHALLENGE_EVERY_N_VISITS === 0) {
            sessionStorage.removeItem(VERIFIED_KEY);
          }
          if (sessionStorage.getItem(VERIFIED_KEY) === '1') {
            document.documentElement.classList.add('orby-gate-unlocked');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        var MAX = 100;
        var state = {
          startedAt: new Date().toISOString(),
          entries: [],
          markers: [],
        };

        function serializeError(err) {
          if (!err) return '';
          if (typeof err === 'string') return err;
          if (err instanceof Error) return err.stack || err.message || String(err);
          try {
            return JSON.stringify(err);
          } catch (e) {
            return String(err);
          }
        }

        function push(level, message, detail) {
          state.entries.push({
            t: Date.now(),
            level: level,
            message: String(message || ''),
            detail: detail || null,
          });
          if (state.entries.length > MAX) state.entries.shift();
        }

        function mark(name, data) {
          state.markers.push({ t: Date.now(), name: name, data: data || null });
          if (state.markers.length > MAX) state.markers.shift();
        }

        function formatReport(extra) {
          var root = document.getElementById('orbyMobile');
          var lines = [
            'Orby Mobile debug log',
            'exported: ' + new Date().toISOString(),
            'started: ' + state.startedAt,
            'url: ' + location.href,
            'ua: ' + navigator.userAgent,
            'boot: ' + (root && root.dataset ? root.dataset.boot || 'unknown' : 'unknown'),
            'viewport: ' + window.innerWidth + 'x' + window.innerHeight + ' @' + window.devicePixelRatio,
          ];
          if (extra) {
            Object.keys(extra).forEach(function (key) {
              lines.push(key + ': ' + extra[key]);
            });
          }
          lines.push('', '--- markers ---');
          if (!state.markers.length) lines.push('(none)');
          else {
            state.markers.forEach(function (m) {
              lines.push(
                '[' + new Date(m.t).toISOString() + '] ' + m.name + (m.data ? ' ' + JSON.stringify(m.data) : ''),
              );
            });
          }
          lines.push('', '--- log ---');
          if (!state.entries.length) lines.push('(no errors captured)');
          else {
            state.entries.forEach(function (e) {
              var line = '[' + new Date(e.t).toISOString() + '] ' + e.level.toUpperCase() + ': ' + e.message;
              if (e.detail) line += ' ' + JSON.stringify(e.detail);
              lines.push(line);
            });
          }
          return lines.join('\n');
        }

        function copyReport(extra) {
          var text = formatReport(extra);
          if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text).then(
              function () {
                return true;
              },
              function () {
                return fallbackCopy(text);
              },
            );
          }
          return Promise.resolve(fallbackCopy(text));
        }

        function fallbackCopy(text) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          var ok = false;
          try {
            ok = document.execCommand('copy');
          } catch (e) {
            ok = false;
          }
          ta.remove();
          return ok;
        }

        function showCopyToast(message) {
          var toast = document.querySelector('.orby-mobile-toast');
          if (!toast) return;
          toast.textContent = message;
          toast.hidden = false;
          toast.classList.add('is-visible');
          window.setTimeout(function () {
            toast.classList.remove('is-visible');
            window.setTimeout(function () {
              toast.hidden = true;
            }, 220);
          }, 2000);
        }

        window.__orbyMobileDebugLog = {
          push: push,
          mark: mark,
          _state: state,
          formatReport: formatReport,
          copyReport: copyReport,
          getExtra: function () {
            return {};
          },
        };

        window.addEventListener(
          'error',
          function (e) {
            push('error', e.message || 'Script error', {
              file: e.filename || null,
              line: e.lineno || null,
              col: e.colno || null,
            });
          },
          true,
        );

        window.addEventListener('unhandledrejection', function (e) {
          push('rejection', serializeError(e.reason), null);
        });

        mark('inline-capture:ready');

        document.addEventListener('DOMContentLoaded', function () {
          var btn = document.querySelector('[data-action="copy-errors"]');
          if (!btn) return;
          btn.addEventListener('click', function () {
            var extra = window.__orbyMobileDebugLog.getExtra ? window.__orbyMobileDebugLog.getExtra() : {};
            copyReport(extra).then(function (ok) {
              showCopyToast(ok ? 'Errors copied' : 'Copy failed');
            });
          });
        });
      })();
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.167.0/",
          "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.36.4/build/index.js",
          "n8ao": "https://cdn.jsdelivr.net/npm/n8ao@1.10.1/dist/N8AO.js"
        }
      }
    </script>
  </head>
  <body class="orby-entry-gate-page">
    <script src="/scripts/orbyEntryGate.js"></script>
    <div id="orbyMobile" class="orby-mobile" data-sheet="closed" data-object-menu="closed" data-active-tab="light" data-hdri-panel="presets-only" data-style-panel="presets-only">
      <main class="orby-mobile-viewport" aria-label="3D viewport">
        <div class="orby-mobile-viewport__canvas"></div>
        <div class="orby-mobile-color-picker" data-color-picker-layer hidden>
          <div class="orby-mobile-color-picker__host" data-color-picker-host></div>
          <button type="button" class="orby-mobile-color-picker__done" data-color-picker-done>Done</button>
        </div>
        <div
          class="orby-mobile-viewport__load-spinner viewport-load-spinner"
          data-viewport-load-spinner
          aria-hidden="true"
          role="status"
        >
          <img src="/assets/images/favicon.svg" alt="" width="56" height="56" draggable="false" />
        </div>
        <div class="orby-mobile-top-actions">
          <div class="orby-mobile-object-menu" data-object-menu="closed">
            <button
              type="button"
              class="orby-mobile-object-btn"
              data-action="toggle-object"
              aria-label="Object"
              aria-expanded="false"
              aria-controls="orbyMobileObjectPanel"
            >
              <span class="orby-mobile-object-btn__icon" aria-hidden="true">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M12 4.5 18.65 8.25V15.75L12 19.5 5.35 15.75V8.25L12 4.5Z"
                    stroke="currentColor"
                    stroke-width="2.25"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
            </button>
          </div>
          <button type="button" class="orby-mobile-export-btn" data-action="export" aria-label="Export image">
            <span class="orby-mobile-export-btn__icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 16V4m0 0 4 4m-4-4-4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <span class="orby-mobile-export-btn__spinner" aria-hidden="true">
              <img src="/assets/images/favicon.svg" alt="" width="22" height="22" draggable="false" />
            </span>
          </button>
        </div>
        <div class="orby-mobile-debug-menu" data-debug-menu="closed">
          <button
            type="button"
            class="orby-mobile-debug-toggle"
            data-action="toggle-debug"
            aria-expanded="false"
            aria-controls="orbyMobileDebugItems"
          >
            Debug
          </button>
          <div class="orby-mobile-debug-menu__items" id="orbyMobileDebugItems" hidden>
            <button type="button" class="orby-mobile-debug-btn" data-action="copy-settings">
              Copy settings
            </button>
            <button type="button" class="orby-mobile-debug-btn" data-action="load-sample">
              Load sample
            </button>
            <button type="button" class="orby-mobile-debug-btn" data-action="copy-errors">
              Copy errors
            </button>
          </div>
        </div>
      </main>

      <div
        class="orby-mobile-object-panel"
        id="orbyMobileObjectPanel"
        data-object-panel
        hidden
        role="region"
        aria-label="Object"
      >
        <div class="orby-mobile-object-panel__controls" data-object-controls></div>
      </div>

      <nav class="orby-mobile-dock" aria-label="Actions">
        <span class="orby-mobile-dock__indicator" aria-hidden="true" hidden></span>
        <button type="button" class="orby-mobile-dock__btn" data-open-tab="light" aria-label="HDRI" aria-expanded="false">
          <span class="orby-mobile-dock__thumb">
            <img data-dock-thumb src="/assets/images/hdri-thumbnail-beach.png" alt="" width="34" height="34" />
            <span class="orby-mobile-dock__clear-icon" data-dock-clear hidden aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </span>
          </span>
          <span>Hdri</span>
        </button>
        <button type="button" class="orby-mobile-dock__btn" data-open-tab="style" aria-label="Shader" aria-expanded="false">
          <span class="orby-mobile-dock__thumb orby-mobile-dock__thumb--clear">
            <img data-dock-thumb src="/assets/images/creative-look-neon-edge.png" alt="" width="34" height="34" hidden />
            <span class="orby-mobile-dock__clear-icon" data-dock-clear aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </span>
          </span>
          <span>Shader</span>
        </button>
        <button type="button" class="orby-mobile-dock__btn" data-open-tab="filters" aria-label="Filter" aria-expanded="false">
          <span class="orby-mobile-dock__thumb orby-mobile-dock__thumb--clear">
            <img data-dock-thumb src="/assets/images/look-filters/studio.png" alt="" width="34" height="34" hidden />
            <span class="orby-mobile-dock__clear-icon" data-dock-clear aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </span>
          </span>
          <span>Filter</span>
        </button>
        <button type="button" class="orby-mobile-dock__btn orby-mobile-dock__btn--fx" data-open-tab="fx" aria-label="Adjust" aria-expanded="false">
          <span class="orby-mobile-dock__icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
            </svg>
          </span>
          <span>Adjust</span>
        </button>
      </nav>

      <section class="orby-mobile-sheet" aria-label="Adjustments">
        <div class="orby-mobile-sheet__grabber" aria-hidden="true"></div>
        <div class="orby-mobile-sheet__body">
          <div class="orby-mobile-sheet__scroll">
            <div class="orby-mobile-panel" data-panel="light">
            <div class="orby-mobile-hdri-controls">
              <div class="orby-mobile-hdri-env-controls" data-hdri-env-controls>
                <label class="orby-mobile-fx-grade slider-line orby-mobile-hdri-controls__row">
                  <span class="orby-mobile-fx-grade__label slider-line-label">Intensity</span>
                  <input
                    type="range"
                    data-hdri-brightness-input
                    min="0"
                    max="3"
                    step="0.1"
                    value="2"
                    aria-label="HDRI intensity"
                  />
                  <span class="orby-mobile-fx-grade__value" data-hdri-brightness-value>2.0</span>
                </label>
                <label class="orby-mobile-fx-grade slider-line orby-mobile-hdri-controls__row">
                  <span class="orby-mobile-fx-grade__label slider-line-label">Blurriness</span>
                  <input
                    type="range"
                    data-hdri-blur-input
                    min="0"
                    max="1"
                    step="0.01"
                    value="0"
                    aria-label="HDRI blurriness"
                  />
                  <span class="orby-mobile-fx-grade__value" data-hdri-blur-value>0.00</span>
                </label>
              </div>
              <div class="orby-mobile-bg-controls" data-bg-controls>
                <label class="orby-mobile-color-line" data-bg-solid-color-row>
                  <span>Color</span>
                  <button
                    type="button"
                    class="orby-mobile-color-swatch"
                    data-bg-color-open
                    aria-label="Background color"
                  ></button>
                </label>
                <div class="orby-mobile-fx-toggle">
                  <span class="orby-mobile-fx-toggle__label">Gradient</span>
                  <label class="effect-toggle">
                    <input type="checkbox" data-bg-gradient-enabled />
                    <span class="effect-indicator" aria-hidden="true"></span>
                    <span class="orby-mobile-sr-only">Enable gradient background</span>
                  </label>
                </div>
                <div class="orby-mobile-bg-gradient" data-bg-gradient-panel hidden>
                  <div class="orby-mobile-seg" role="group" aria-label="Gradient type">
                    <button type="button" class="orby-mobile-seg__btn is-active" data-bg-gradient-type="linear">Linear</button>
                    <button type="button" class="orby-mobile-seg__btn" data-bg-gradient-type="radial">Radial</button>
                  </div>
                  <label class="orby-mobile-color-line">
                    <span>Start color</span>
                    <button
                      type="button"
                      class="orby-mobile-color-swatch"
                      data-bg-gradient-color="0"
                      aria-label="Gradient start color"
                    ></button>
                  </label>
                  <label class="orby-mobile-color-line">
                    <span>End color</span>
                    <button
                      type="button"
                      class="orby-mobile-color-swatch"
                      data-bg-gradient-color="1"
                      aria-label="Gradient end color"
                    ></button>
                  </label>
                  <label class="orby-mobile-fx-grade slider-line" data-bg-gradient-angle-row>
                    <span class="orby-mobile-fx-grade__label slider-line-label">Angle</span>
                    <input type="range" data-bg-gradient-angle min="0" max="360" step="1" value="180" aria-label="Gradient angle" />
                    <span class="orby-mobile-fx-grade__value" data-bg-gradient-angle-value>180°</span>
                  </label>
                  <div data-bg-gradient-center-rows hidden>
                    <label class="orby-mobile-fx-grade slider-line">
                      <span class="orby-mobile-fx-grade__label slider-line-label">Center X</span>
                      <input type="range" data-bg-gradient-center-x min="0" max="100" step="1" value="50" aria-label="Gradient center X" />
                      <span class="orby-mobile-fx-grade__value" data-bg-gradient-center-x-value>50%</span>
                    </label>
                    <label class="orby-mobile-fx-grade slider-line">
                      <span class="orby-mobile-fx-grade__label slider-line-label">Center Y</span>
                      <input type="range" data-bg-gradient-center-y min="0" max="100" step="1" value="50" aria-label="Gradient center Y" />
                      <span class="orby-mobile-fx-grade__value" data-bg-gradient-center-y-value>50%</span>
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="orby-mobile-panel orby-mobile-panel--style" data-panel="style" hidden>
            <div class="orby-mobile-style-controls" data-style-controls hidden></div>
          </div>
          <div class="orby-mobile-panel orby-mobile-panel--adjust" data-panel="fx" hidden>
            <div class="orby-mobile-fx-controls" data-fx-controls></div>
          </div>
          </div>
          <div class="orby-mobile-sheet__shelf" aria-label="Presets">
            <div class="orby-mobile-preset-rail" data-rail="light" data-panel="light">
              <div class="orby-mobile-preset-rail__track" data-rail-track="light"></div>
            </div>
            <div class="orby-mobile-preset-rail" data-rail="style" data-panel="style" hidden>
              <div class="orby-mobile-preset-rail__track" data-rail-track="style"></div>
            </div>
            <div class="orby-mobile-preset-rail" data-rail="filters" data-panel="filters" hidden>
              <div class="orby-mobile-preset-rail__track" data-rail-track="filters"></div>
            </div>
          </div>
        </div>
      </section>

      <button type="button" class="orby-mobile-scrim" data-sheet-dismiss hidden aria-label="Close panel"></button>
      <div class="orby-mobile-toast" role="status" aria-live="polite" hidden></div>
    </div>

    <input
      id="orbyMobileFileInput"
      type="file"
      class="orby-mobile-sr-file"
      accept=".glb,.gltf,model/gltf-binary,model/gltf+json"
      aria-label="Import 3D model"
      tabindex="-1"
    />

    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
