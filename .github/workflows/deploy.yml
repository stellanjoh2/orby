name: Deploy to GitHub Pages

# For bug reports from Pages: add repository Variable BUG_REPORT_API_URL
# (e.g. https://your-deployment.vercel.app/api/bug-report) so the static
# site can POST to your Vercel serverless route. CORS on that route must
# allow https://orby.studio (or leave BUG_REPORT_ALLOWED_ORIGINS unset on Vercel
# to echo the request Origin).
# Optional: TURNSTILE_SITE_KEY (public) must match TURNSTILE_SECRET_KEY on Vercel.
# Optional: UPSTASH_REDIS_REST_URL + UPSTASH_REDIS_REST_TOKEN on Vercel for rate limits.
# ORBY_SR_PHRASE (Actions Secret) — studio shell phrase; only a SHA-256 digest lands in built JS.

on:
  push:
    branches:
      - main

# Queue Pages deploys instead of cancelling mid-flight. Cancelling during
# deploy-pages status polling leaves an orphaned deployment_in_progress and
# surfaces "Deployment failed, try again later." Rapid pushes rely on deploy retries.
concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
        env:
          BUG_REPORT_API_URL: ${{ vars.BUG_REPORT_API_URL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          ORBY_SR_PHRASE: ${{ secrets.ORBY_SR_PHRASE }}
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages (1/3)
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before deploy retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (2/3)
        if: steps.deploy1.outcome == 'failure'
        id: deploy2
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before deploy retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (3/3)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        id: deploy3
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Verify deploy succeeded
        if: always() && steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success' && steps.deploy3.outcome != 'success'
        run: |
          echo "GitHub Pages deploy failed after 3 attempts."
          exit 1
